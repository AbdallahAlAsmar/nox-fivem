  <text x="256" y="452" font-family="'Geist Mono','Courier New',monospace" font-size="76" font-weight="700" fill="#FFFFFF" letter-spacing="10" text-anchor="middle">NOXES<tspan font-weight="400" font-size="61" fill="#3DFFA2">.</tspan></text>
